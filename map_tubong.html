// =========================
// STYLE ĐỒNG NHẤT
// =========================

    color: "#ff0000",
    weight: 3,
    fillColor: "#3388ff",
    fillOpacity: 0.3
};

// =========================
// HIỂN THỊ TẤT CẢ POLYGON
// =========================

boundaries.forEach(boundary => {

    const layer = L.geoJSON(boundary, {

        style: polygonStyle,

        onEachFeature: function(feature, layer){

            layer.bindPopup(
                "<b>" + feature.properties.name + "</b>"
            );

        }

    });

    layer.addTo(group);

});

// =========================
// AUTO ZOOM
// =========================

map.fitBounds(group.getBounds());
